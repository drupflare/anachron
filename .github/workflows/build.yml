name: Build Package

on:
  push:
    branches: [master, feat/*, ver/*]
  pull_request:
    branches: [master, feat/*, ver/*]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring, tokenizer
          coverage: none
      - name: Validate composer.json
        run: composer validate --strict --no-check-lock
      - name: Run PHP Lint
        run: php tests/lint.php
      - name: Cache Composer Downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-
      - name: Install Composer Dependencies
        run: composer install --no-interaction --no-progress
      - name: Check Coding Standards
        run: ./vendor/bin/phpcs
      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

  unit:
    name: Unit Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring, tokenizer
          coverage: none
      - name: Cache Composer Downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-
      - name: Install Composer Dependencies
        run: composer install --no-interaction --no-progress
      - name: Run PHPUnit
        run: ./vendor/bin/phpunit

  scripts:
    name: Tooling Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: json, mbstring, tokenizer
          coverage: none
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Type Check
        run: bun run typecheck
      - name: Run Tooling Tests
        run: bun run test:scripts
      - name: Check the CMS Boundary
        run: bun run boundary

  classes:
    name: Class Loading Gate (Drupal ${{ matrix.drupal }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    continue-on-error: ${{ matrix.experimental }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - drupal: '11.4.11'
            php: '8.3'
            experimental: false
          - drupal: '12.0.0-beta2'
            php: '8.5'
            experimental: true

    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring, dom, xml, tokenizer
          coverage: none
      - name: Cache Drupal Tree
        id: drupal
        uses: actions/cache@v6
        with:
          path: drupal-root
          key: drupal-${{ matrix.drupal }}
      - name: Fetch Drupal Tree
        if: steps.drupal.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 "https://ftp.drupal.org/files/projects/drupal-${{ matrix.drupal }}.tar.gz" -o /tmp/drupal.tar.gz
          mkdir -p drupal-root
          tar -xzf /tmp/drupal.tar.gz --strip-components=1 -C drupal-root
      - name: Load Every Class Against Real Drupal
        run: php tests/load-classes.php ./drupal-root
