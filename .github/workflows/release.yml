name: Release Project

on:
  workflow_dispatch:
    inputs:
      changelog:
        type: string
        description: 'Changelog to replace the auto-generated one'
      suffix:
        type: string
        description: 'Suffix to append to the version'
        default: ''
  schedule:
    - cron: '40 4 * * *'

jobs:
  gate:
    if: github.event_name == 'workflow_dispatch'
    name: Release Gate
    uses: ./.github/workflows/build.yml

  release-check:
    if: github.event_name == 'workflow_dispatch'
    name: Release Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Check the Release
        run: bun run release:check

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: [gate, release-check]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Extract Version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Extracted Version: $VERSION"
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "package.json has no version field; the tag would be 'vundefined'." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Retrieve Latest Tag
        id: latest_tag
        run: echo "LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> $GITHUB_ENV
      - name: Generate Changelog
        if: ${{ github.event.inputs.changelog == '' }}
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configuration: '.github/release.json'
          mode: 'HYBRID'
          fromTag: '${{ env.LATEST_TAG }}'
          toTag: '${{ github.ref_name }}'
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}${{ github.event.inputs.suffix }}
          name: 'drupflare/anachron v${{ env.VERSION }}${{ github.event.inputs.suffix }}'
          body: |
            Commit: ${{ github.sha }}

            ${{ steps.changelog.outputs.changelog || github.event.inputs.changelog }}
          draft: false
          prerelease: ${{ github.ref_name != 'master' || contains(env.VERSION, '-') || startsWith(env.VERSION, '0.') }}

  nightly-gate:
    if: github.event_name == 'schedule'
    name: Nightly Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    outputs:
      fresh: ${{ steps.fresh.outputs.fresh }}

    env:
      DRUPAL_VERSION: 11.4.11

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for Commits in the Last Day
        id: fresh
        run: |
          if [ -z "$(git log --since='24 hours ago' --format=%H)" ]; then
            echo "fresh=false" >> $GITHUB_OUTPUT
          else
            echo "fresh=true" >> $GITHUB_OUTPUT
          fi
      - name: Set up PHP
        if: steps.fresh.outputs.fresh == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, mbstring, dom, xml, tokenizer
          coverage: none
      - name: Install Composer Dependencies
        if: steps.fresh.outputs.fresh == 'true'
        run: composer install --no-interaction --no-progress
      - name: Run Lint and Static Analysis
        if: steps.fresh.outputs.fresh == 'true'
        run: |
          php tests/lint.php
          ./vendor/bin/phpcs
          ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: Run PHPUnit
        if: steps.fresh.outputs.fresh == 'true'
        run: ./vendor/bin/phpunit
      - name: Fetch Drupal Tree
        if: steps.fresh.outputs.fresh == 'true'
        run: |
          curl -fsSL --retry 3 "https://ftp.drupal.org/files/projects/drupal-${DRUPAL_VERSION}.tar.gz" -o /tmp/drupal.tar.gz
          mkdir -p drupal-root
          tar -xzf /tmp/drupal.tar.gz --strip-components=1 -C drupal-root
      - name: Load Every Class Against Real Drupal
        if: steps.fresh.outputs.fresh == 'true'
        run: php tests/load-classes.php ./drupal-root

  nightly-publish:
    if: ${{ github.event_name == 'schedule' && needs.nightly-gate.outputs.fresh == 'true' }}
    name: Nightly Publish
    runs-on: ubuntu-latest
    needs: nightly-gate

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - name: Build the Nightly Identity
        run: |
          SHORT=$(git rev-parse --short HEAD)
          echo "NIGHTLY_TAG=nightly-$(date -u +%Y%m%d)-${SHORT}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT}" >> $GITHUB_ENV
      - name: Create Nightly Prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.NIGHTLY_TAG }}
          name: 'nightly ${{ env.SHORT_SHA }}'
          body: |
            Unreleased build of `master`.

            - Commit: `${{ github.sha }}`

            This tag is not a Composer version, so Packagist ignores it. To install this
            code, require `dev-master`, which now resolves to the commit above.
          draft: false
          prerelease: true
          make_latest: false
